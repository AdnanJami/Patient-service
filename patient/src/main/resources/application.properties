logging.level.root = info

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer

# Patient events go through an outbox table: requests never wait on Kafka, and OutboxRelay
# publishes the stored events in the background, retrying every outbox.relay.interval-ms while
# Kafka is down. max.block.ms bounds each attempt against an unreachable broker to 2s (default 60s).
spring.kafka.producer.properties.max.block.ms=2000
outbox.relay.interval-ms=1000
