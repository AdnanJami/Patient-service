server {
    listen 80;
    root /usr/share/nginx/html;

    # Forward API calls to the gateway on the internal Docker network
    location /auth/ {
        proxy_pass http://api-gateway:4004;
    }
    location /api/ {
        proxy_pass http://api-gateway:4004;
    }

    # Single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri /index.html;
    }
}
